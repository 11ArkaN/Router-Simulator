name: conformance

on:
  push:
  pull_request:

# Test jobs need only repository contents. Declaring the narrow token contract
# here prevents a future action default from acquiring write permission.
permissions:
  contents: read

# Only the newest commit on one branch can produce a useful conformance result.
# Superseded queued runs otherwise consume private-repository runner capacity
# while reporting against code that is no longer the branch head.
concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["address,undefined", "thread"]
    steps:
      # Full commit pins make action execution reproducible while the comment
      # keeps the human-readable upstream release visible to maintainers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache pinned native OpenSSL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/downloads/openssl-3.5.7.tar.gz
            .tools/dependencies/native/openssl-3.5.7
          key: ${{ runner.os }}-${{ runner.arch }}-native-openssl-3.5.7-${{ hashFiles('scripts/bootstrap-native-linux-dependencies.sh') }}
      - name: Install native build and PCAPNG validation tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update && sudo apt-get install -y build-essential perl tshark
      - name: Bootstrap pinned native OpenSSL
        run: bash scripts/bootstrap-native-linux-dependencies.sh
      - name: Configure native core
        run: >-
          cmake -S core -B build/native -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DOPENSSL_ROOT_DIR=${{ github.workspace }}/.tools/dependencies/native/openssl-3.5.7
          -DOPENSSL_USE_STATIC_LIBS=TRUE
          -DROUTER_BUILD_MANUAL=OFF
          -DROUTER_BUILD_BENCHMARKS=OFF
          -DROUTER_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build native core
        run: cmake --build build/native --parallel
      - name: Run native core tests
        run: ctest --test-dir build/native --output-on-failure

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 11.0.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # Build trees are intentionally excluded. The restored SDK, verified
      # archives and installed libraries are sufficient for an incremental
      # bootstrap and stay well below the repository cache quota.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/python
            .tools/emsdk
            .tools/downloads
            .tools/dependencies
          key: windows-x64-emscripten-6.0.3-cmake-4.4.0-ninja-1.13.0-openssl-3.5.7-nghttp2-1.69.0-nghttp3-1.17.0-ngtcp2-1.24.0-${{ hashFiles('scripts/bootstrap-toolchain.ps1', 'scripts/bootstrap-dependencies.ps1') }}
          restore-keys: |
            windows-x64-emscripten-6.0.3-cmake-4.4.0-ninja-1.13.0-
      - run: pnpm install --frozen-lockfile
      - run: pnpm toolchain:bootstrap
      - name: Install pinned PCAPNG validation tool
        shell: pwsh
        run: |
          # core.ps1 validates captures with tshark instead of accepting only
          # the project's own decoder. Pinning the Chocolatey package keeps the
          # independent parser reproducible, while disabling Npcap avoids a
          # kernel-driver install that offline fixture validation does not use.
          choco install wireshark --version=4.6.7 --yes --no-progress --params="'/NdisCapNo'"
          "C:\Program Files\Wireshark" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # The production Wasm link requires these pinned static libraries. A
      # successful toolchain bootstrap alone cannot satisfy that contract.
      - run: pnpm dependencies:bootstrap
      - run: pnpm verify
      # Chrome and Edge are preinstalled on windows-latest. Firefox is pinned
      # by Playwright so all three production browser contracts run in CI.
      - run: pnpm test:e2e:install
      - run: pnpm test:e2e
