name: conformance

on:
  push:
  pull_request:

jobs:
  native-sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        sanitizers: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PCAPNG validator
        run: sudo apt-get update && sudo apt-get install -y tshark
      - name: Configure native core
        run: cmake -S core -B build/native -G Ninja -DROUTER_BUILD_MANUAL=OFF -DROUTER_BUILD_BENCHMARKS=OFF -DROUTER_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build native core
        run: cmake --build build/native
      - name: Run native core tests
        run: ctest --test-dir build/native --output-on-failure

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .tools
          key: windows-emscripten-6.0.3-cmake-4.4.0-ninja-1.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm toolchain:bootstrap
      - run: pnpm verify
