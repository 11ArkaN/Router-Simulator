id: 7750-sr-7-iom4-e
vendor: Nokia
nos: SR OS
release: 26.7.R1
reference_date: 2026-07-09
chassis: 7750 SR-7
chassis_slots: 5
system:
  default_name: R1
  # These strings describe the pinned emulated image, not the Codex build or
  # browser bundle. show system information consumes them as device identity.
  software_version: C-26.7.R1
  crypto_module_version: N/A
  configuration_mode: mixed
  # These values are SR OS system defaults exposed by show system information.
  # They live in the release profile so another release can change them without
  # modifying the shared report renderer.
  snmp_port: 161
  config_backup_count: 50
  dns_resolve_preference: ipv4-only
  dnssec_response_control: drop
control:
  slot: A
  card: cpm5
  initial_state: active-ready
line_card:
  slot: 1
  type: iom4-e
  initial_state: absent
  initialization_milliseconds: 2000
  timing_status: experimental
mda:
  slot: 1
  slots_per_card: 1
  modeled_type: me10-10gb-sfp+
  supported:
    - me10-10gb-sfp+
    - me1-100gb-cfp2
  initial_state: absent
  initialization_milliseconds: 1000
  timing_status: experimental
forwarding_complexes: 1
ports:
  count: 10
  speed_mbps: 10000
  # A newly exposed SR OS Ethernet port is administratively disabled. The two
  # endpoint-facing ports below are enabled by the saved starter lab, not by a
  # generic hardware or provisioning default.
  initially_enabled: [1/1/1, 1/1/2]
  # SR OS network Ethernet ports other than Fast Ethernet use 9212 bytes by
  # default. The configured value includes the MAC addresses and EtherType but
  # excludes preamble, SFD and FCS. Source: nokia.sros.26_7.port.ethernet_mtu.
  default_mtu: 9212
  minimum_mtu: 512
  maximum_mtu: 9212
  modeled:
    - 1/1/1
    - 1/1/2
router_interfaces:
  - name: to-host-a
    port: 1/1/1
    admin_state: enable
    mac: "02:00:00:00:01:01"
    address: 192.0.2.1/30
    network: 192.0.2.0/30
  - name: to-host-b
    port: 1/1/2
    admin_state: enable
    mac: "02:00:00:00:01:02"
    address: 198.51.100.1/30
    network: 198.51.100.0/30
hosts:
  - id: host-a
    name: Host A
    mac: "02:00:00:00:00:0A"
    address: 192.0.2.2/30
    gateway: 192.0.2.1
  - id: host-b
    name: Host B
    mac: "02:00:00:00:00:0B"
    address: 198.51.100.2/30
    gateway: 198.51.100.1
links:
  - id: host-a-r1
    host: host-a
    router_port: 1/1/1
  - id: r1-host-b
    host: host-b
    router_port: 1/1/2
ui_defaults:
  router_id: r1
  sidebar_width: 194
  sidebar_width_min: 96
  sidebar_width_max: 4096
  inspector_width: 324
  inspector_width_min: 160
  inspector_width_max: 4096
  terminal_height: 360
  terminal_height_min: 90
  # Validation rejects nonsensical imported numbers, while CSS applies the
  # actual limit from the live viewport and keeps the topology reachable.
  terminal_height_max: 4096
  nodes:
    host-a: { x: 72, y: 170 }
    r1: { x: 410, y: 170 }
    host-b: { x: 748, y: 170 }
resources:
  runtime_worker_count: 2
  pthread_pool_min: 2
  pthread_pool_max: 4
  # One command slot must hold the complete atomic running datastore with ten
  # maximum-length port descriptions. Partial configuration is never streamed.
  command_message_bytes: 4096
  response_message_bytes: 16384
  static_route_capacity: 8
  fib_route_capacity: 18
  packet_pool_bytes: 67108864
  capture_memory_bytes: 33554432
  # TX and RX queues are device buffers owned by one forwarding shard. Their
  # capacity is independent from frames already admitted onto the medium.
  link_queue_frames: 256
  link_inflight_frames: 2048
  adjacency_pending_frames: 8
  command_ring_capacity: 64
  response_ring_capacity: 8
  forwarding_ring_capacity: 16
  cli_input_queue_bytes: 65536
  # CLI output is streamed through bounded 16 KiB response chunks. The whole
  # command result remains capped at 1 MiB before xterm's pager owns it.
  cli_output_queue_bytes: 1048576
  wasm_initial_memory_bytes: 268435456
timing:
  ping_timeout_milliseconds: 2000
  # Base router interfaces inherit the SR OS dynamic ARP aging default.
  arp_timeout_seconds: 14400
  telemetry_interval_milliseconds: 250
  equipment_poll_milliseconds: 250
  worker_shutdown_milliseconds: 250
  worker_startup_poll_milliseconds: 10
  worker_startup_attempts: 200
  telemetry_read_attempts: 4
  autosave_debounce_milliseconds: 400
limits:
  system_name_bytes: 64
  # The port description leaf accepts 1 to 80 printable ASCII characters.
  port_description_bytes: 80
  host_name_bytes: 64
  project_name_bytes: 128
  # Notes are portable project metadata, not an SR OS leaf. The bound prevents
  # an imported text field from dominating IndexedDB and .netsim memory.
  project_notes_bytes: 65536
cli_defaults:
  ping_count: 5
  ping_size: 56
  ping_min_size: 12
  # The first endpoint profile stores one untagged 1514-byte frame. Larger SR
  # OS ping sizes remain outside this profile until jumbo endpoint buffers land.
  ping_max_size: 1472
  # SR OS 26.7.R1 global ping count range is 1 to 100000. The optional count
  # syntax remains hidden until asynchronous Ctrl-C cancellation is available.
  ping_max_count: 100000
  history_entries: 50
abi:
  # Version 4 exposes physical-link presence separately from ifOperStatus.
  # Nokia show port documents that Physical Link and Oper State are distinct.
  runtime_snapshot: 4
  telemetry: 4
  # Version 2 adds the router-owned terminal history region to terminal:state.
  runtime_messages: 2
  # Version 4 adds structural forwarding queues, encoded frames, relative link
  # deadlines, ARP request suppression and endpoint protocol progress.
  checkpoint: 4
link_defaults:
  # Propagation belongs to the cable or circuit, not to the Nokia port. The
  # project copies this value into each new physical link and may override it
  # independently without changing the 10 Gb/s serialization rate.
  propagation_delay_nanoseconds: 100
  propagation_status: experimental
  source_id: ieee.802_3.ethernet_frame_timing
capture_interfaces:
  - link-host-a-to-router
  - link-router-to-host-a
  - link-host-b-to-router
  - link-router-to-host-b
  - router-1/1/1-ingress
  - router-1/1/2-ingress
  - router-1/1/1-egress
  - router-1/1/2-egress
  - cpm-punt
capability_status: partially-implemented
source_ids:
  - nokia.sros.26_7.sr7.supported_hardware
  - nokia.sros.26_7.physical_port.provisioning
  - nokia.sros.26_7.show.system_information
  - nokia.sros.26_7.show.system_alarms
  - nokia.sros.26_7.arp.aging
  - ieee.802_3.ethernet_frame_timing
