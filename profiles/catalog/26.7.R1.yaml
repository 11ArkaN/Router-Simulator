    ports: [{ count: 2, speeds_mbps: [100000] }, { count: 2, speeds_mbps: [800000] }]
  m5e8-100g-sfp112+2-800g-qdd:
    ethernet: true
    ports: [{ count: 8, speeds_mbps: [100000] }, { count: 2, speeds_mbps: [800000] }]
  m5e10-100g-qsfp28: { ethernet: true, ports: [{ count: 10, speeds_mbps: [100000] }] }
  m5e16-100g-sfp112: { ethernet: true, ports: [{ count: 16, speeds_mbps: [100000] }] }
