version: 3
byte_order: little-endian
fields:
  - magic
  - checkpoint_schema_hash
  - profile_hash
  - hardware_deadlines
  - running_configuration
  - candidate_configuration
  - running_unsaved
  - hardware_inventory
  - link_signals
  - project_hosts
  - project_links
  - port_counters
  - operational_counters
  # ARP records include their wall expiry so restore can rebase the remaining
  # lifetime onto the new forwarding shard's monotonic clock.
  - arp_entries_with_expiry
  - connected_route_activation_times
  - static_route_activation_times
  - port_operational_transition_state
  - active_link_alarm_state
  # Version 3 adds MD workflow, per-engine current and previous working paths,
  # pending exit confirmation and the classic unsaved prompt indicator.
  - cli_session_workflow_and_context
  - fib_generation
