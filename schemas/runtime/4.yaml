version: 4
snapshot_abi: 6
# The ABI remains the sixth value-graph format. This revision changes its
# schema hash because forwarding-owner Echo timestamps are now persisted.
checkpoint_layout_revision: 2

# Protocol 4 routes every operation by stable project identity. The operation
# name is the first netstring; every following field is length framed so user
# names, descriptions and terminal input cannot alter message boundaries.
operations:
  snapshot: snapshot
  router_create: router-create
  router_delete: router-delete
  system_name_set: system-name-set
  router_configuration_replace: router-configuration-replace
  host_create: host-create
  host_create_configured: host-create-configured
  host_delete: host-delete
  host_name_set: host-name-set
  host_update: host-update
  hardware_card_set: hardware-card-set
  hardware_mda_set: hardware-mda-set
  hardware_card_admin_set: hardware-card-admin-set
  hardware_mda_admin_set: hardware-mda-admin-set
  port_configure: port-configure
  interface_configure: interface-configure
  interface_delete: interface-delete
  static_route_add: static-route-add
  static_route_delete: static-route-delete
  link_create: link-create
  link_delete: link-delete
  link_admin_set: link-admin-set
  link_properties_set: link-properties-set
  host_configure: host-configure
  host_dhcpv6_replace: host-dhcpv6-replace
  host_dns_replace: host-dns-replace
  router_ping_start: router-ping-start
  router_ping_status: router-ping-status
  host_ping_start: host-ping-start
  host_ping_status: host-ping-status
  session_create: session-create
  session_close: session-close
  session_state: session-state
  session_execute: session-execute
  session_poll: session-poll
  session_cancel: session-cancel
  session_complete: session-complete
  capture_point_set: capture-point-set
  capture_selection_replace: capture-selection-replace
