    status: implemented
    notes: Pure interface and neighbor state machines cover startup, waiting, DR and BDR election with non-preemption, adjacency formation, database exchange failures, one-way regression and teardown. The owner-local interface validates area, instance, mask, E-bit and timer compatibility before mutation, schedules Hello and inactivity deadlines on steady_clock and emits version-specific Hello bodies. Each neighbor owns bounded, atomic database summary, request, retransmission and delayed-acknowledgment lists with exact LSA generation matching and no borrowed LSDB pointers. Owners supply events and local adjacency eligibility explicitly, so the FSM has no cross-router or topology dependency. Neighbor-unicast transmission retains the protocol-selected interface, scopes IPv6 link-local resolution to that zone and uses ordinary ARP or Neighbor Discovery instead of deriving a MAC from topology or received OSPF traffic.
