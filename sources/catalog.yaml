  - id: ietf.ospf.interface_neighbor_fsm.rfc2328
    kind: routing-protocol-state-machine
    release: 26.7.R1
    platforms: [all-supported]
    source_type: ietf-internet-standard
    source_url: https://www.rfc-editor.org/rfc/rfc2328
    section: Sections 9.3, 9.4 and 10.3
    rfc_refs: [RFC2328, RFC5340, RFC4007, RFC4861]
    yang_path: null
    last_verified_at: 2026-07-25
    implementation: [core/include/router/ospf_fsm.hpp, core/include/router/ospf_interface.hpp, core/include/router/ospf_database_exchange.hpp, core/include/router/router_forwarder.hpp, core/src/ospf/ospf_fsm.cpp, core/src/ospf/ospf_interface.cpp, core/src/ospf/ospf_database_exchange.cpp, core/src/forwarding/router_forwarder.cpp]
